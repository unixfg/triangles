name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint, and package
    runs-on: [self-hosted, Linux, X64, workstation-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Lint
        run: .venv/bin/python -m ruff check custom_components tests scripts
      - name: Check formatting
        run: .venv/bin/python -m ruff format --check custom_components tests scripts
      - name: Test against Home Assistant 2026.9.4
        run: .venv/bin/python -m pytest
      - name: Build manual installation ZIP
        run: .venv/bin/python scripts/package.py
      - name: Upload manual installation ZIP
        uses: actions/upload-artifact@v7
        with:
          name: triangles-manual-install
          path: dist/triangles-*.zip
          if-no-files-found: error
