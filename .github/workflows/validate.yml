name: Validate for HACS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: [self-hosted, Linux, X64, workstation-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: [self-hosted, Linux, X64, workstation-ci]
    timeout-minutes: 15
    steps:
      - name: Validate repository
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm --pull=always \
            -e INPUT_GITHUB_TOKEN \
            -e INPUT_CATEGORY=integration \
            -e INPUT_COMMENT=false \
            -e REPOSITORY \
            -e REPOSITORY_REF \
            -e GITHUB_REPOSITORY \
            -e GITHUB_WORKSPACE=/tmp \
            -e GITHUB_ACTIONS=true \
            ghcr.io/hacs/action:main
